name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The README claims python 3.10+. This matrix is what makes that a claim
      # the repo checks rather than one it asserts.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # The suite needs no key and no network: collectors are faked and the
      # judge is mock_judge. If this ever starts needing either, that is a bug.
      - name: Test
        run: python -m pytest -q
