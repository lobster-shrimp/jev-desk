name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The README claims python 3.10+. This matrix is what makes that a claim
      # the repo checks rather than one it asserts.
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # --no-deps installs the lock and nothing else. If requirements.txt is
      # missing an entry, pip cannot quietly paper over it with a floating
      # version, so the gap surfaces here instead of months later.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements.txt
          python -m pip check

      # The suite needs no key and no network: collectors are faked and the
      # judge is mock_judge. If this ever starts needing either, that is a bug.
      - name: Test
        run: python -m pytest -q

  # A lock only stabilises anything if it tracks its source. This fails when
  # requirements.in has been edited without recompiling requirements.txt.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"

      - name: requirements.txt matches requirements.in
        run: |
          uv pip compile requirements.in -o requirements.txt \
            --universal --python-version 3.10 --quiet
          git diff --exit-code -- requirements.txt
