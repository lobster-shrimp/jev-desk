<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jev-desk ops</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0a;
  color: #e0e0e0;
  font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
  font-size: 13px;
  line-height: 1.5;
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}
h1 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 20px;
  color: #fff;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  margin-left: 8px;
}
.badge.shadow { background: #4a5568; color: #fff; }
.badge.live { background: #e91e63; color: #fff; }
.summary {
  margin-bottom: 25px;
  padding: 20px;
  background: #111;
  border-left: 4px solid #fb8c00;
}
.summary-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 12px;
}
.summary-text {
  font-size: 14px;
  line-height: 1.6;
  color: #bbb;
  margin-bottom: 8px;
}
.summary-text:last-child { margin-bottom: 0; }
.summary-highlight {
  color: #fb8c00;
  font-weight: 600;
}
.summary-warning {
  color: #ef5350;
  font-weight: 600;
}
.summary-ok {
  color: #66bb6a;
  font-weight: 600;
}
.meta {
  margin-bottom: 30px;
  padding: 15px;
  background: #111;
  border-left: 3px solid #333;
}
.meta-row {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.meta-row:last-child { margin-bottom: 0; }
.meta-item {
  display: flex;
  gap: 8px;
}
.meta-label {
  color: #888;
  min-width: 80px;
}
.meta-value {
  color: #e0e0e0;
  font-weight: 500;
}
.outcome-NO_TRADE { color: #64748b; }
.outcome-SHADOW { color: #fb8c00; }
.outcome-ORDER { color: #e91e63; }
.outcome-ERROR { color: #ef5350; }
.outcome-HOLDING { color: #42a5f5; }
.section {
  margin-bottom: 25px;
}
.section-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  color: #fff;
  border-bottom: 1px solid #222;
  padding-bottom: 5px;
}
.histogram {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.hist-group {
  background: #111;
  padding: 10px;
  border-left: 2px solid #333;
}
.hist-group.free { border-left-color: #64748b; }
.hist-group.trade { border-left-color: #fb8c00; }
.hist-group.chain { border-left-color: #e91e63; }
.hist-group.soft { border-left-color: #ab47bc; }
.hist-title {
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 5px;
  font-weight: 600;
}
.hist-item {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
  font-size: 12px;
}
.hist-reason { color: #bbb; }
.hist-count {
  color: #fff;
  font-weight: 600;
  min-width: 30px;
  text-align: right;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 10px;
}
.stat-box {
  background: #111;
  padding: 12px;
  border-left: 2px solid #333;
}
.stat-label {
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.stat-value {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
}
.funnel {
  display: flex;
  flex-direction: column;
  gap: 3px;
  background: #111;
  padding: 20px;
}
.funnel-stage {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 10px;
  background: #0a0a0a;
  border-left: 3px solid #333;
  transition: all 0.2s ease;
}
.funnel-stage:hover {
  background: #151515;
  border-left-color: #fb8c00;
}
.funnel-stage.stage-seen { border-left-color: #42a5f5; }
.funnel-stage.stage-free { border-left-color: #64748b; }
.funnel-stage.stage-defer { border-left-color: #9e9e9e; }
.funnel-stage.stage-trade { border-left-color: #fb8c00; }
.funnel-stage.stage-chain { border-left-color: #e91e63; }
.funnel-stage.stage-soft { border-left-color: #ab47bc; }
.funnel-stage.stage-judged { border-left-color: #66bb6a; }
.funnel-stage.stage-pick { border-left-color: #ffc107; }
.funnel-label {
  flex: 0 0 120px;
  font-weight: 600;
  color: #fff;
  font-size: 13px;
}
.funnel-bar-container {
  flex: 1;
  height: 24px;
  background: #1a1a1a;
  border-radius: 3px;
  overflow: hidden;
  position: relative;
}
.funnel-bar {
  height: 100%;
  background: linear-gradient(90deg, #fb8c00, #e91e63);
  transition: width 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 8px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
}
.funnel-count {
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  min-width: 40px;
  text-align: right;
}
.age-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 15px;
  background: #111;
}
.age-box {
  padding: 15px;
  background: #0a0a0a;
  border-left: 3px solid #333;
}
.age-box.young { border-left-color: #66bb6a; }
.age-box.old { border-left-color: #fb8c00; }
.age-title {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 10px;
}
.age-stat {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 12px;
  border-bottom: 1px solid #1a1a1a;
}
.age-stat:last-child { border-bottom: none; }
.age-stat-label { color: #888; }
.age-stat-value { color: #fff; font-weight: 600; }
.kill-detail {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #1a1a1a;
}
.kill-detail-title {
  font-size: 11px;
  text-transform: uppercase;
  color: #888;
  margin-bottom: 5px;
}
.kill-detail-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.kill-detail-item {
  font-size: 11px;
  padding: 3px 8px;
  background: #1a1a1a;
  border-radius: 3px;
  color: #bbb;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: #111;
}
th {
  text-align: left;
  padding: 8px;
  background: #0a0a0a;
  color: #888;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 600;
  border-bottom: 1px solid #222;
}
td {
  padding: 6px 8px;
  border-bottom: 1px solid #1a1a1a;
  font-size: 12px;
}
tr:hover td { background: #151515; }
.stage-free { color: #64748b; }
.stage-trade { color: #fb8c00; }
.stage-chain { color: #e91e63; }
.stage-soft { color: #ab47bc; }
.stage-judged { color: #66bb6a; }
.verdict-PASS { color: #66bb6a; }
.verdict-DROP { color: #ef5350; }
.empty {
  padding: 30px;
  text-align: center;
  color: #555;
  background: #111;
  font-style: italic;
}
.footer {
  margin-top: 40px;
  padding-top: 20px;
  border-top: 1px solid #222;
  color: #555;
  font-size: 11px;
  text-align: center;
}
.error {
  padding: 15px;
  background: #2c1515;
  border-left: 3px solid #ef5350;
  color: #ffcdd2;
  margin-bottom: 20px;
}
@media (max-width: 768px) {
  body { padding: 10px; font-size: 12px; }
  .histogram { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 11px; }
}
</style>
</head>
<body>
<h1>jev-desk ops<span id="mode-badge" class="badge shadow">shadow</span></h1>

<div id="error-box" class="error" style="display:none;"></div>

<div id="summary-box" class="summary" style="display:none;">
  <div class="summary-title">What Happened</div>
  <div id="summary-content"></div>
</div>

<div class="meta">
  <div class="meta-row">
    <div class="meta-item">
      <span class="meta-label">Updated</span>
      <span class="meta-value" id="updated-at">—</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Outcome</span>
      <span class="meta-value" id="outcome">—</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">Judge Health</span>
      <span class="meta-value" id="judge-health">—</span>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Funnel</div>
  <div id="funnel-viz"></div>
</div>

<div class="section">
  <div class="section-title">Age Distribution</div>
  <div id="age-viz"></div>
</div>

<div class="section">
  <div class="section-title">Cycle Stats</div>
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">Seen</div>
      <div class="stat-value" id="stat-seen">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Benched</div>
      <div class="stat-value" id="stat-benched">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Judged</div>
      <div class="stat-value" id="stat-judged">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Bench Count</div>
      <div class="stat-value" id="stat-bench">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Requeued</div>
      <div class="stat-value" id="stat-requeued">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Young (&lt;60m)</div>
      <div class="stat-value" id="stat-young">—</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Old (≥60m)</div>
      <div class="stat-value" id="stat-old">—</div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">Kill Histograms</div>
  <div id="histograms" class="histogram"></div>
</div>

<div class="section">
  <div class="section-title">Held Positions</div>
  <div id="held-section"></div>
</div>

<div class="section">
  <div class="section-title">Tokens (stage/reason)</div>
  <div id="tokens-section"></div>
</div>

<div class="footer">
  Refreshes every 20s · Real data only, no demo tokens
</div>

<script>
let lastUpdated = null;

function formatTimestamp(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return d.toLocaleString();
}

function renderFunnel(state) {
  const funnelDiv = document.getElementById('funnel-viz');
  
  if (!state.cycle) {
    funnelDiv.innerHTML = '<div class="empty">No cycle data</div>';
    return;
  }
  
  const cycle = state.cycle;
  const killed = cycle.killed || {};
  const tokens = state.tokens || [];
  
  // Calculate funnel stages
  const seen = cycle.seen || 0;
  const benched = cycle.benched || 0;
  const examined = seen - benched;
  
  const totalFreeKills = Object.values(killed.free || {}).reduce((a,b) => a+b, 0);
  const totalTradeKills = Object.values(killed.trade || {}).reduce((a,b) => a+b, 0);
  const totalChainKills = Object.values(killed.chain || {}).reduce((a,b) => a+b, 0);
  const totalSoftKills = Object.values(killed.soft || {}).reduce((a,b) => a+b, 0);
  const judged = cycle.judged || 0;
  const requeued = cycle.requeued || 0;
  
  const afterFree = examined - totalFreeKills;
  const afterTrade = afterFree - totalTradeKills;
  const afterChain = afterTrade - totalChainKills - requeued;
  const afterSoft = afterChain - totalSoftKills;
  const picked = cycle.outcome === 'SHADOW' || cycle.outcome === 'ORDER' ? 1 : 0;
  
  // Helper to safely calculate width percentage (avoid division by zero)
  const safeWidthPct = (count, total) => {
    return total > 0 ? (count / total * 100) : 0;
  };
  
  // Funnel stages with colors and counts
  const stages = [
    { label: 'Seen', count: seen, color: '#42a5f5', stage: 'seen', width: 100 },
    { label: 'Examined (−benched)', count: examined, color: '#64748b', stage: 'examined', width: safeWidthPct(examined, seen) },
    { label: '↓ Free Kills', count: totalFreeKills, color: '#64748b', stage: 'free', isKill: true },
    { label: 'After Free', count: afterFree, color: '#9e9e9e', stage: 'after-free', width: safeWidthPct(afterFree, seen) },
    { label: '↓ Trade Kills', count: totalTradeKills, color: '#fb8c00', stage: 'trade', isKill: true },
    { label: 'After Trade', count: afterTrade, color: '#fb8c00', stage: 'after-trade', width: safeWidthPct(afterTrade, seen) },
    { label: '↓ Chain Kills', count: totalChainKills, color: '#e91e63', stage: 'chain', isKill: true },
    { label: '↓ Requeued (429)', count: requeued, color: '#9e9e9e', stage: 'requeue', isKill: true },
    { label: 'After Chain', count: afterChain, color: '#e91e63', stage: 'after-chain', width: safeWidthPct(afterChain, seen) },
    { label: '↓ Soft Kills', count: totalSoftKills, color: '#ab47bc', stage: 'soft', isKill: true },
    { label: 'Judged (passed all)', count: judged, color: '#66bb6a', stage: 'judged', width: safeWidthPct(judged, seen) },
    { label: '→ Picked', count: picked, color: '#ffc107', stage: 'pick', width: safeWidthPct(picked, seen) },
  ];
  
  const funnelHTML = stages.map(s => {
    if (s.isKill) {
      return `
        <div class="funnel-stage stage-${s.stage}">
          <div class="funnel-label">${s.label}</div>
          <div class="funnel-count" style="color: #ef5350;">−${s.count}</div>
        </div>
      `;
    } else {
      const widthPercent = Math.max(s.width || 0, 2);
      return `
        <div class="funnel-stage stage-${s.stage}">
          <div class="funnel-label">${s.label}</div>
          <div class="funnel-bar-container">
            <div class="funnel-bar" style="width: ${widthPercent}%; background: ${s.color};">
              ${widthPercent > 15 ? s.count : ''}
            </div>
          </div>
          <div class="funnel-count">${s.count}</div>
        </div>
      `;
    }
  }).join('');
  
  funnelDiv.innerHTML = `<div class="funnel">${funnelHTML}</div>`;
}

function renderAgeDistribution(tokens) {
  const ageDiv = document.getElementById('age-viz');
  
  if (!tokens || tokens.length === 0) {
    ageDiv.innerHTML = '<div class="empty">No token data</div>';
    return;
  }
  
  // Separate young (<60m) and old (>=60m) tokens
  const youngTokens = tokens.filter(t => t.age_minutes != null && t.age_minutes < 60);
  const oldTokens = tokens.filter(t => t.age_minutes != null && t.age_minutes >= 60);
  
  function analyzeTokens(tokens, label) {
    const total = tokens.length;
    const killed = tokens.filter(t => t.verdict === 'DROP').length;
    const passed = tokens.filter(t => t.verdict === 'PASS').length;
    
    const killsByStage = {};
    const killsByReason = {};
    tokens.filter(t => t.verdict === 'DROP').forEach(t => {
      killsByStage[t.stage] = (killsByStage[t.stage] || 0) + 1;
      if (t.reason) {
        killsByReason[t.reason] = (killsByReason[t.reason] || 0) + 1;
      }
    });
    
    const ages = tokens.map(t => t.age_minutes).filter(a => a != null);
    const avgAge = ages.length > 0 ? (ages.reduce((a,b) => a+b, 0) / ages.length) : 0;
    const minAge = ages.length > 0 ? Math.min(...ages) : 0;
    const maxAge = ages.length > 0 ? Math.max(...ages) : 0;
    
    return { total, killed, passed, killsByStage, killsByReason, avgAge, minAge, maxAge };
  }
  
  const youngAnalysis = analyzeTokens(youngTokens, 'Young');
  const oldAnalysis = analyzeTokens(oldTokens, 'Old');
  
  function renderBox(analysis, label, className) {
    const topReasons = Object.entries(analysis.killsByReason)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5)
      .map(([reason, count]) => `<span class="kill-detail-item">${reason}: ${count}</span>`)
      .join('');
    
    return `
      <div class="age-box ${className}">
        <div class="age-title">${label} Tokens (&lt;60m)</div>
        <div class="age-stat">
          <span class="age-stat-label">Total</span>
          <span class="age-stat-value">${analysis.total}</span>
        </div>
        <div class="age-stat">
          <span class="age-stat-label">Killed</span>
          <span class="age-stat-value">${analysis.killed}</span>
        </div>
        <div class="age-stat">
          <span class="age-stat-label">Passed</span>
          <span class="age-stat-value">${analysis.passed}</span>
        </div>
        <div class="age-stat">
          <span class="age-stat-label">Avg Age</span>
          <span class="age-stat-value">${analysis.avgAge.toFixed(1)}m</span>
        </div>
        <div class="age-stat">
          <span class="age-stat-label">Age Range</span>
          <span class="age-stat-value">${analysis.minAge.toFixed(0)}–${analysis.maxAge.toFixed(0)}m</span>
        </div>
        ${topReasons ? `
          <div class="kill-detail">
            <div class="kill-detail-title">Top Kill Reasons</div>
            <div class="kill-detail-list">${topReasons}</div>
          </div>
        ` : ''}
      </div>
    `;
  }
  
  const html = `
    <div class="age-grid">
      ${renderBox(youngAnalysis, 'Young', 'young')}
      ${renderBox(oldAnalysis, 'Old', 'old')}
    </div>
  `;
  
  ageDiv.innerHTML = html;
}

function formatTimestamp(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return `${diff}s ago`;
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return d.toLocaleString();
}

function renderSummary(state) {
  const box = document.getElementById('summary-box');
  const content = document.getElementById('summary-content');
  
  if (!state.cycle) {
    box.style.display = 'none';
    return;
  }
  
  const cycle = state.cycle;
  const seen = cycle.seen || 0;
  const benched = cycle.benched || 0;
  const judged = cycle.judged || 0;
  const killed = cycle.killed || {};
  
  // Hoist examined to function scope (used later in liquidity drain check)
  const examined = (seen || 0) - (benched || 0);
  
  const lines = [];
  
  // Outcome summary
  if (cycle.outcome === 'HOLDING') {
    const held = state.held && state.held.length > 0 ? state.held[0] : null;
    if (held) {
      lines.push(`<span class="summary-ok">HOLDING ${held.ticker || '?'} for ${Math.round(held.minutes || 0)} minutes.</span> Desk is owned by RISK, no scan running.`);
    } else {
      lines.push(`<span class="summary-ok">HOLDING</span> a position, no scan running.`);
    }
  } else if (cycle.outcome === 'ERROR') {
    lines.push(`<span class="summary-warning">ERROR:</span> ${cycle.error || 'unknown error'}`);
  } else if (cycle.outcome === 'NO TRADE') {
    lines.push(`<span class="summary-highlight">NO TRADE</span> this cycle.`);
  } else if (cycle.outcome === 'SHADOW' || cycle.outcome === 'ORDER') {
    const order = state.pick;
    if (order && order.token) {
      const conf = order.confidence !== null ? ` conf ${order.confidence.toFixed(2)}` : '';
      lines.push(`<span class="summary-ok">${cycle.outcome}:</span> ${order.token.ticker} on ${order.token.chain}, size x${order.size_factor}${conf}, model ${order.model}`);
    } else {
      lines.push(`<span class="summary-ok">${cycle.outcome}</span> this cycle.`);
    }
  }
  
  // Flow summary
  if (seen > 0) {
    lines.push(`Saw <span class="summary-highlight">${seen}</span> tokens, <span class="summary-highlight">${benched}</span> already benched, examined <span class="summary-highlight">${examined}</span>.`);
  }
  
  // Kill analysis - emphasize age kills and data quality
  const freeKills = killed.free || {};
  const tradeKills = killed.trade || {};
  const chainKills = killed.chain || {};
  const softKills = killed.soft || {};
  
  const totalFree = Object.values(freeKills).reduce((a,b) => a+b, 0);
  const totalTrade = Object.values(tradeKills).reduce((a,b) => a+b, 0);
  const totalChain = Object.values(chainKills).reduce((a,b) => a+b, 0);
  const totalSoft = Object.values(softKills).reduce((a,b) => a+b, 0);
  const totalKilled = totalFree + totalTrade + totalChain + totalSoft;
  
  if (totalKilled > 0) {
    const killParts = [];
    if (totalFree > 0) killParts.push(`<span class="summary-highlight">${totalFree}</span> free`);
    if (totalTrade > 0) killParts.push(`<span class="summary-highlight">${totalTrade}</span> trade`);
    if (totalChain > 0) killParts.push(`<span class="summary-highlight">${totalChain}</span> chain`);
    if (totalSoft > 0) killParts.push(`<span class="summary-highlight">${totalSoft}</span> soft`);
    lines.push(`Killed ${killParts.join(', ')}.`);
    
    // Trade kill details with age visibility
    if (totalTrade > 0) {
      const tradeTokens = (state.tokens || []).filter(t => t.stage === 'trade' && t.verdict === 'DROP');
      if (tradeTokens.length > 0) {
        const tradeBreakdown = {};
        tradeTokens.forEach(t => {
          tradeBreakdown[t.reason] = (tradeBreakdown[t.reason] || []).concat(t);
        });
        const tradeDetails = Object.entries(tradeBreakdown).map(([reason, tokens]) => {
          const ages = tokens.map(t => t.age_minutes).filter(a => a != null);
          const avgAge = ages.length > 0 ? (ages.reduce((a,b) => a+b, 0) / ages.length).toFixed(1) : '?';
          const tickers = tokens.slice(0, 3).map(t => t.ticker || '?').join(', ');
          const more = tokens.length > 3 ? ` +${tokens.length - 3} more` : '';
          return `${reason} (${tokens.length}, avg ${avgAge}m): ${tickers}${more}`;
        }).join('; ');
        lines.push(`<span class="summary-warning">Trade kills:</span> ${tradeDetails}`);
      }
    }
    
    // Chain kill details with age visibility
    if (totalChain > 0) {
      const chainTokens = (state.tokens || []).filter(t => t.stage === 'chain' && t.verdict === 'DROP');
      if (chainTokens.length > 0) {
        const chainBreakdown = {};
        chainTokens.forEach(t => {
          chainBreakdown[t.reason] = (chainBreakdown[t.reason] || []).concat(t);
        });
        const chainDetails = Object.entries(chainBreakdown).map(([reason, tokens]) => {
          const ages = tokens.map(t => t.age_minutes).filter(a => a != null);
          const avgAge = ages.length > 0 ? (ages.reduce((a,b) => a+b, 0) / ages.length).toFixed(1) : '?';
          const tickers = tokens.slice(0, 3).map(t => t.ticker || '?').join(', ');
          const more = tokens.length > 3 ? ` +${tokens.length - 3} more` : '';
          return `${reason} (${tokens.length}, avg ${avgAge}m): ${tickers}${more}`;
        }).join('; ');
        lines.push(`<span class="summary-warning">Chain kills:</span> ${chainDetails}`);
      }
    }
    
    // Emphasize age kills
    if (freeKills.age > 0) {
      const ageTokens = (state.tokens || []).filter(t => t.reason === 'age' && t.stage === 'free');
      if (ageTokens.length > 0) {
        const ages = ageTokens.map(t => t.age_minutes).filter(a => a != null);
        if (ages.length > 0) {
          const avgAge = (ages.reduce((a,b) => a+b, 0) / ages.length).toFixed(1);
          const minAge = Math.min(...ages).toFixed(1);
          const maxAge = Math.max(...ages).toFixed(1);
          lines.push(`<span class="summary-warning">Age kills dominate:</span> ${freeKills.age} tokens dropped at free stage. Ages: ${minAge}–${maxAge} min (avg ${avgAge} min). All killed before judge.`);
        } else {
          lines.push(`<span class="summary-warning">Age kills dominate:</span> ${freeKills.age} tokens dropped at free stage, all before judge.`);
        }
      }
    }
    
    // Data quality breakdown - distinguish missing data from threshold failures
    const missingDataKills = (freeKills.no_liq || 0) + (freeKills.no_vol || 0) + (freeKills.no_mcap || 0);
    const thresholdKills = (freeKills.liquidity || 0) + (freeKills.volume || 0) + (freeKills.mcap || 0);
    
    if (missingDataKills > 0 || thresholdKills > 0) {
      const dataParts = [];
      if (missingDataKills > 0) {
        dataParts.push(`<span class="summary-warning">${missingDataKills} missing data</span> (no_liq: ${freeKills.no_liq || 0}, no_vol: ${freeKills.no_vol || 0}, no_mcap: ${freeKills.no_mcap || 0})`);
      }
      if (thresholdKills > 0) {
        dataParts.push(`<span class="summary-highlight">${thresholdKills} below thresholds</span> (liq: ${freeKills.liquidity || 0}, vol: ${freeKills.volume || 0}, mcap: ${freeKills.mcap || 0})`);
      }
      lines.push(`Data quality: ${dataParts.join(', ')}.`);
    }
    
    // Liquidity drain story - when liquidity kills dominate
    const liquidityKills = (freeKills.liquidity || 0) + (freeKills.no_liq || 0);
    if (examined > 0 && liquidityKills > examined * 0.3) {
      const liqTokens = (state.tokens || []).filter(t => 
        (t.reason === 'liquidity' || t.reason === 'no_liq') && t.stage === 'free'
      );
      if (liqTokens.length > 0) {
        const withLiq = liqTokens.filter(t => t.liquidity_usd != null);
        if (withLiq.length > 0) {
          const avgLiq = (withLiq.reduce((sum, t) => sum + (t.liquidity_usd || 0), 0) / withLiq.length);
          const maxLiq = Math.max(...withLiq.map(t => t.liquidity_usd || 0));
          lines.push(`<span class="summary-warning">Liquidity drain:</span> ${liquidityKills} tokens killed on liquidity (${Math.round(liquidityKills / examined * 100)}% of examined). Avg liq $${Math.round(avgLiq).toLocaleString()}, max $${Math.round(maxLiq).toLocaleString()}.`);
        } else {
          lines.push(`<span class="summary-warning">Liquidity drain:</span> ${liquidityKills} tokens killed on liquidity (${Math.round(liquidityKills / examined * 100)}% of examined), all missing data.`);
        }
      }
    }
  }
  
  // Judge activity - never imply health when judged=0
  if (judged > 0) {
    lines.push(`Judge saw <span class="summary-ok">${judged}</span> tokens (passed free/trade/chain gates).`);
  } else if (totalKilled > 0) {
    lines.push(`<span class="summary-warning">Judge idle:</span> zero tokens made it past free/trade/chain gates. Not healthy even if process is up.`);
  } else {
    lines.push(`<span class="summary-warning">No activity:</span> zero tokens examined, judge idle.`);
  }
  
  content.innerHTML = lines.map(l => `<div class="summary-text">${l}</div>`).join('');
  box.style.display = 'block';
}

function renderJudgeHealth(state) {
  const el = document.getElementById('judge-health');
  
  if (!state.cycle) {
    el.textContent = '—';
    return;
  }
  
  const judged = state.cycle.judged || 0;
  const error = state.cycle.error;
  
  if (error) {
    el.textContent = 'ERROR';
    el.style.color = '#ef5350';
  } else if (judged > 0) {
    el.textContent = `OK (${judged} judged)`;
    el.style.color = '#66bb6a';
  } else {
    el.textContent = 'waiting (0 judged)';
    el.style.color = '#888';
  }
}

function renderHistograms(killed) {
  const stages = ['free', 'trade', 'chain', 'soft'];
  const histDiv = document.getElementById('histograms');
  histDiv.innerHTML = '';
  
  let hasAny = false;
  stages.forEach(stage => {
    const kills = killed[stage] || {};
    const entries = Object.entries(kills);
    if (entries.length === 0) return;
    
    hasAny = true;
    const group = document.createElement('div');
    group.className = `hist-group ${stage}`;
    
    const title = document.createElement('div');
    title.className = 'hist-title';
    title.textContent = stage;
    group.appendChild(title);
    
    entries.sort((a, b) => b[1] - a[1]).forEach(([reason, count]) => {
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = `<span class="hist-reason">${reason}</span><span class="hist-count">${count}</span>`;
      group.appendChild(item);
    });
    
    histDiv.appendChild(group);
  });
  
  if (!hasAny) {
    histDiv.innerHTML = '<div class="empty">No kills this cycle</div>';
  }
}

function renderHeld(held) {
  const section = document.getElementById('held-section');
  if (!held || held.length === 0) {
    section.innerHTML = '<div class="empty">No held positions</div>';
    return;
  }
  
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Chain</th>
        <th>Held For</th>
      </tr>
    </thead>
    <tbody>
      ${held.map(h => `
        <tr>
          <td>${h.ticker || '—'}</td>
          <td>${h.chain || h.net || '—'}</td>
          <td>${h.minutes ? Math.round(h.minutes) + 'm' : '—'}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  section.innerHTML = '';
  section.appendChild(table);
}

function renderTokens(tokens) {
  const section = document.getElementById('tokens-section');
  if (!tokens || tokens.length === 0) {
    section.innerHTML = '<div class="empty">No token data this cycle</div>';
    return;
  }
  
  function formatMetric(value, missingLabel = 'missing') {
    if (value === null || value === undefined) {
      return `<span style="color: #ef5350;">${missingLabel}</span>`;
    }
    if (value === 0) {
      return `<span style="color: #fb8c00;">$0</span>`;
    }
    return '$' + Math.round(value).toLocaleString();
  }
  
  const table = document.createElement('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>Ticker</th>
        <th>Chain</th>
        <th>Stage</th>
        <th>Reason</th>
        <th>Verdict</th>
        <th>MCap USD</th>
        <th>Liq USD</th>
        <th>Age min</th>
      </tr>
    </thead>
    <tbody>
      ${tokens.map(t => `
        <tr>
          <td>${t.ticker || '—'}</td>
          <td>${t.chain || '—'}</td>
          <td class="stage-${t.stage}">${t.stage || '—'}</td>
          <td>${t.reason || '—'}</td>
          <td class="verdict-${t.verdict}">${t.verdict || '—'}</td>
          <td>${formatMetric(t.mcap_usd)}</td>
          <td>${formatMetric(t.liquidity_usd)}</td>
          <td>${t.age_minutes != null ? Math.round(t.age_minutes) : '—'}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  section.innerHTML = '';
  section.appendChild(table);
}

async function refresh() {
  try {
    const resp = await fetch('/api/state');
    if (!resp.ok && resp.status === 404) {
      const data = await resp.json();
      if (data.demo === false) {
        document.getElementById('error-box').textContent = 'No state.json yet — wait for a cycle';
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('summary-box').style.display = 'none';
        return;
      }
    }
    
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    
    const state = await resp.json();
    document.getElementById('error-box').style.display = 'none';
    
    if (state.demo === true) {
      document.getElementById('error-box').textContent = 'Demo mode not supported — ops panel shows real data only';
      document.getElementById('error-box').style.display = 'block';
      document.getElementById('summary-box').style.display = 'none';
      return;
    }
    
    const badge = document.getElementById('mode-badge');
    badge.textContent = state.mode;
    badge.className = `badge ${state.mode}`;
    
    document.getElementById('updated-at').textContent = formatTimestamp(state.updated_at);
    
    if (state.cycle) {
      const outcome = state.cycle.outcome || '—';
      const outcomeEl = document.getElementById('outcome');
      outcomeEl.textContent = outcome;
      outcomeEl.className = `meta-value outcome-${outcome.replace(' ', '_')}`;
      
      document.getElementById('stat-seen').textContent = state.cycle.seen || 0;
      document.getElementById('stat-benched').textContent = state.cycle.benched || 0;
      document.getElementById('stat-judged').textContent = state.cycle.judged || 0;
      document.getElementById('stat-requeued').textContent = state.cycle.requeued || 0;
      
      // Young vs old counts
      const tokens = state.tokens || [];
      const youngCount = tokens.filter(t => t.age_minutes != null && t.age_minutes < 60).length;
      const oldCount = tokens.filter(t => t.age_minutes != null && t.age_minutes >= 60).length;
      document.getElementById('stat-young').textContent = youngCount;
      document.getElementById('stat-old').textContent = oldCount;
      
      if (state.cycle.killed) {
        renderHistograms(state.cycle.killed);
      }
      
      renderSummary(state);
      renderJudgeHealth(state);
      renderFunnel(state);
    } else {
      document.getElementById('summary-box').style.display = 'none';
    }
    
    document.getElementById('stat-bench').textContent = state.bench || 0;
    
    renderHeld(state.held);
    renderTokens(state.tokens);
    renderAgeDistribution(state.tokens);
    
    lastUpdated = state.updated_at;
  } catch (err) {
    document.getElementById('error-box').textContent = `Error: ${err.message}`;
    document.getElementById('error-box').style.display = 'block';
    document.getElementById('summary-box').style.display = 'none';
  }
}

refresh();
setInterval(refresh, 20000);
</script>
</body>
</html>
